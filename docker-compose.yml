# reusable block so we dont have to repeat the same stuff for each service
x-seaweedfs-common: &seaweedfs-common
  image: bah/seaweedfs:${SEAWEEDFS_VERSION}
  build:
    context: .
    args:
      SEAWEEDFS_VERSION: ${SEAWEEDFS_VERSION}
  restart: unless-stopped

services:
  master:
    <<: *seaweedfs-common
    ports:
      - "9333:9333"
      - "19333:19333"
      - "9324:9324"
    command: ["master", "-ip=master", "-ip.bind=0.0.0.0", "-metricsPort=9324"]

  volume:
    <<: *seaweedfs-common
    ports:
      - "8080:8080"
      - "18080:18080"
      - "9325:9325"
    command: ["volume", "-ip=volume", "-master=master:9333", "-ip.bind=0.0.0.0", "-port=8080", "-metricsPort=9325"]
    depends_on:
      - master

  filer:
    <<: *seaweedfs-common
    ports:
      - "8888:8888"
      - "18888:18888"
      - "9326:9326"
    command: ["filer", "-ip=filer", "-master=master:9333", "-ip.bind=0.0.0.0", "-metricsPort=9326"]
    depends_on:
      - master
      - volume

  s3:
    <<: *seaweedfs-common
    ports:
      - "8333:8333"
      - "9327:9327"
    command: ["s3", "-filer=filer:8888", "-ip.bind=0.0.0.0", "-metricsPort=9327"]
    depends_on:
      - master
      - volume
      - filer

  webdav:
    <<: *seaweedfs-common
    ports:
      - "7333:7333"
    command: ["webdav", "-filer=filer:8888"]
    depends_on:
      - master
      - volume
      - filer
